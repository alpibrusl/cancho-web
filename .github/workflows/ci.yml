name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The two sibling checkouts the build reads packages from, and the compiler
  # that builds them. The locks in deps/ pin source hashes; these pin the
  # repositories (and the compiler, whose bundled `std` no lock records).
  LEX_SYS_REV: 232a59c8451aa7df0b72ab0d0ee053b26a951e86
  SCHEMA_REV: 3873669c78a1d2642735ac35f1126575d7ec88d1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ env.LEX_SYS_REV }}
          path: lex-sys

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lexsys-schema
          ref: ${{ env.SCHEMA_REV }}
          path: lexsys-schema

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ env.LEX_SYS_REV }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Test tooling
        run: pip install jsonschema openapi-spec-validator schemathesis

      # Real binary, real sockets, a real client; Schemathesis generates its
      # requests from the service's own OpenAPI document.
      - name: End-to-end tests
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          LEX_SYS_DIR: ${{ github.workspace }}/lex-sys
          SCHEMA_DIR: ${{ github.workspace }}/lexsys-schema
        run: python3 tests/e2e.py

      # The equivalence check the benchmark runs first needs FastAPI; it is
      # not run here. Checking the harness still compiles is enough.
      - name: kload compiles
        working-directory: web
        run: cc -O2 -o /tmp/kload benches/kload.c -lpthread
