name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The two sibling checkouts the build reads packages from, and the compiler
  # that builds them. The locks in deps/ pin source hashes; these pin the
  # repositories (and the compiler, whose bundled `std` no lock records).
  LEX_SYS_REV: 0a2a43c92729b4126d710e66dc61c64a548fe527
  SCHEMA_REV: 10d30edab333e5cfb5445c430020ed1999872e2f
  PG_REV: c5ef36c07c7057f230fc5f41cbeffcc370a79b60

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lex-sys
          ref: ${{ env.LEX_SYS_REV }}
          path: lex-sys

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lexsys-schema
          ref: ${{ env.SCHEMA_REV }}
          path: lexsys-schema

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/lexsys-pg
          ref: ${{ env.PG_REV }}
          path: lexsys-pg

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: lex-sys/target/release/lex-sys
          key: lex-sys-${{ env.LEX_SYS_REV }}

      - name: Build lex-sys
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: lex-sys
        run: cargo build --release -p lex-sys

      - name: Test tooling
        run: |
          pip install jsonschema openapi-spec-validator schemathesis
          which psql || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      # A PostgreSQL for examples/users_pg (trust authentication: the service logs in with
      # `-`, and SCRAM is lexsys-pg's own test).
      - name: PostgreSQL 16
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16 >/dev/null
          for i in $(seq 1 60); do psql -h 127.0.0.1 -U postgres -Atc 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          psql -h 127.0.0.1 -U postgres -c 'create database users_pg'

      # Real binary, real sockets, a real client; Schemathesis generates its
      # requests from the service's own OpenAPI document.
      - name: End-to-end tests
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          LEX_SYS_DIR: ${{ github.workspace }}/lex-sys
          SCHEMA_DIR: ${{ github.workspace }}/lexsys-schema
        run: python3 tests/e2e.py

      # The same tests, the same OpenAPI document (plus the U+0000 pattern) and Schemathesis, with
      # PostgreSQL as the store.
      - name: End-to-end tests, users_pg
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          LEX_SYS_DIR: ${{ github.workspace }}/lex-sys
          SCHEMA_DIR: ${{ github.workspace }}/lexsys-schema
          PG_DIR: ${{ github.workspace }}/lexsys-pg
          USERS_PG: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: users_pg
        run: python3 tests/e2e.py

      # The same again with a pool of database connections: a request that needs the database is held
      # while its query is queued, and the loop goes on (`http.server`'s `hold`/`answer`, `pg.pool`).
      # NonBlocking's own tests run in both runs; here the whole suite is the pooled service's.
      - name: End-to-end tests, users_pg with a pool
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          LEX_SYS_DIR: ${{ github.workspace }}/lex-sys
          SCHEMA_DIR: ${{ github.workspace }}/lexsys-schema
          PG_DIR: ${{ github.workspace }}/lexsys-pg
          USERS_PG: "1"
          USERS_PG_POOL: "2"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: users_pg
        run: python3 tests/e2e.py

      # `examples/users_pg/queries.ls` is what `pgen` writes for `queries.sql` against that schema.
      - name: The generated queries are the generated queries
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          psql -d users_pg -q -v ON_ERROR_STOP=1 -f examples/users_pg/schema.sql
          $LEX_SYS build --std ../lexsys-pg/tools/pgen.ls ../lexsys-pg/src/pg.ls -o /tmp/pgen
          /tmp/pgen 127.0.0.1 5432 postgres users_pg - examples/users_pg/queries.sql > /tmp/queries.ls
          diff /tmp/queries.ls examples/users_pg/queries.ls

      # `web`'s documents, derived by hand, against what it writes (build/deps was
      # fetched by the end-to-end run's build), and the sources formatted.
      - name: web unit tests and formatting
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
        run: |
          $LEX_SYS test tests/web_test.ls src/web.ls build/deps/*.ls --std
          $LEX_SYS fmt --check examples src tests

      # The Go and C servers the benchmark compares against must still do the
      # same work as the service (the gate `benches/run.sh` runs before timing).
      # The FastAPI half of that gate and the timing are not run here.
      - name: Go and C implementations agree with the service
        working-directory: web
        env:
          LEX_SYS: ${{ github.workspace }}/lex-sys/target/release/lex-sys
          LEX_SYS_DIR: ${{ github.workspace }}/lex-sys
          SCHEMA_DIR: ${{ github.workspace }}/lexsys-schema
        run: benches/check.sh

      - name: kload compiles
        working-directory: web
        run: cc -O2 -o /tmp/kload benches/kload.c -lpthread
